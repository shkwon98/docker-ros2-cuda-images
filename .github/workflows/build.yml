name: Build images

on:
  pull_request:
    paths:
      - .dockerignore
      - .github/workflows/**
      - Dockerfile
      - images.json
      - ros_entrypoint.sh
      - scripts/**
      - tests/**
  push:
    branches: [main]
    paths:
      - .dockerignore
      - .github/workflows/**
      - Dockerfile
      - images.json
      - ros_entrypoint.sh
      - scripts/**
      - tests/**
  schedule:
    - cron: "17 3 1 * *"
  workflow_dispatch:

concurrency:
  group: images-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      created: ${{ steps.matrix.outputs.created }}
    steps:
      - uses: actions/checkout@v4
      - name: Test configuration and publication checks
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Verify README image table
        shell: bash
        run: |
          diff -u \
            <(python3 scripts/matrix.py --readme-table images.json) \
            <(awk '/<!-- BEGIN GENERATED CONFIGURATIONS -->/{printing=1} printing{print} /<!-- END GENERATED CONFIGURATIONS -->/{exit}' README.md)
      - name: Generate image matrix
        id: matrix
        run: |
          echo "matrix=$(python3 scripts/matrix.py images.json)" >> "$GITHUB_OUTPUT"
          echo "created=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

  images:
    needs: prepare
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    uses: ./.github/workflows/image.yml
    with:
      image: ${{ toJSON(matrix) }}
      created: ${{ needs.prepare.outputs.created }}
      publish: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    secrets:
      dockerhub-token: ${{ secrets.DOCKERHUB_TOKEN }}
