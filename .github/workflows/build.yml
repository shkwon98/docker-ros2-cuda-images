name: Build images

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Test matrix generator
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Generate matrix
        id: matrix
        run: echo "matrix=$(python3 scripts/matrix.py images.json)" >> "$GITHUB_OUTPUT"
      - name: Verify base image platforms
        shell: bash
        run: |
          set -euo pipefail
          while IFS=$'\t' read -r base platform cuda_version; do
            image=$(docker buildx imagetools inspect --format '{{json .Image}}' "$base")
            python3 -c '
          import json
          import sys

          image = json.load(sys.stdin)
          platform = sys.argv[1]
          cuda_version = sys.argv[2]
          if "architecture" in image:
              actual_platform = "{}/{}".format(image["os"], image["architecture"])
              assert actual_platform == platform, (actual_platform, platform)
              config = image["config"]
          else:
              assert platform in image, (platform, sorted(image))
              config = image[platform]["config"]
          assert f"CUDA_VERSION={cuda_version}" in config["Env"]
          ' "$platform" "$cuda_version" <<<"$image"
          done < <(
            python3 scripts/matrix.py images.json |
              jq -r '.builds.include | unique_by([.base_image, .platform])[] | [.base_image, .platform, .cuda_version] | @tsv'
          )

  build:
    needs: prepare
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix).builds }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Set image metadata
        id: metadata
        shell: bash
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/ros2-cuda" >> "$GITHUB_OUTPUT"
          echo "created=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"
      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build platform image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ steps.metadata.outputs.image }},push-by-digest=true,name-canonical=true,push=${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
          build-args: |
            BASE_IMAGE=${{ matrix.base_image }}
            BUILD_DATE=${{ steps.metadata.outputs.created }}
            CUDA_TYPE=${{ matrix.cuda_type }}
            EXPECTED_CUDA_VERSION=${{ matrix.cuda_version }}
            EXPECTED_UBUNTU_VERSION=${{ matrix.ubuntu_version }}
            ROS_APT_SOURCE_PACKAGE=${{ matrix.ros_apt_source_package }}
            ROS_APT_SOURCE_SHA256=${{ matrix.ros_apt_source_sha256 }}
            ROS_APT_SOURCE_VERSION=${{ matrix.ros_apt_source_version }}
            ROS_DISTRO=${{ matrix.ros_distro }}
            ROS_VARIANT=${{ matrix.ros_variant }}
            UBUNTU_CODENAME=${{ matrix.ubuntu_codename }}
            VCS_REF=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.os_tag }}-${{ matrix.platform_slug }}
          cache-to: type=gha,mode=max,scope=${{ matrix.os_tag }}-${{ matrix.platform_slug }},ignore-error=true
      - name: Export digest
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          digest='${{ steps.build.outputs.digest }}'
          test "${digest#sha256:}" != "$digest"
          mkdir -p /tmp/digests
          touch "/tmp/digests/${digest#sha256:}"
      - name: Upload digest
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.tag }}-${{ matrix.platform_slug }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: [prepare, build]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix).manifests }}
    steps:
      - uses: docker/setup-buildx-action@v3
      - name: Set image metadata
        id: metadata
        shell: bash
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/ros2-cuda" >> "$GITHUB_OUTPUT"
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          pattern: digests-${{ matrix.tag }}-*
          path: /tmp/digests
          merge-multiple: true
      - name: Create manifest
        env:
          IMAGE: ${{ steps.metadata.outputs.image }}
          OS_TAG: ${{ matrix.os_tag }}
          TAG: ${{ matrix.tag }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t digests < <(find /tmp/digests -maxdepth 1 -type f -printf '%f\n' | sort)
          test "${#digests[@]}" -eq 2
          sources=()
          for digest in "${digests[@]}"; do
            sources+=("${IMAGE}@sha256:${digest}")
          done
          docker buildx imagetools create \
            --tag "${IMAGE}:${TAG}" \
            --tag "${IMAGE}:${OS_TAG}" \
            "${sources[@]}"
      - name: Verify published manifest
        env:
          CUDA_TYPE: ${{ matrix.cuda_type }}
          IMAGE: ${{ steps.metadata.outputs.image }}:${{ matrix.tag }}
          PLATFORMS: ${{ toJSON(matrix.platforms) }}
          ROS_DISTRO: ${{ matrix.ros_distro }}
          ROS_VARIANT: ${{ matrix.ros_variant }}
          UBUNTU_CODENAME: ${{ matrix.ubuntu_codename }}
          UBUNTU_VERSION: ${{ matrix.ubuntu_version }}
        run: |
          docker buildx imagetools inspect --format '{{json .Image}}' "$IMAGE" > image.json
          python3 - <<'PY'
          import json
          import os

          image = json.load(open("image.json"))
          platforms = json.loads(os.environ["PLATFORMS"])
          assert set(image) == set(platforms), (sorted(image), sorted(platforms))

          for platform, platform_config in platforms.items():
              config = image[platform]["config"]
              assert config["Entrypoint"] == ["/opt/nvidia/nvidia_entrypoint.sh"]
              labels = config["Labels"]
              expected_labels = {
                  "org.opencontainers.image.base.name": platform_config["base_image"],
                  "io.github.shkwon98.cuda.type": os.environ["CUDA_TYPE"],
                  "io.github.shkwon98.cuda.version": platform_config["cuda_version"],
                  "io.github.shkwon98.ros.distro": os.environ["ROS_DISTRO"],
                  "io.github.shkwon98.ros.variant": os.environ["ROS_VARIANT"],
                  "io.github.shkwon98.ubuntu.codename": os.environ["UBUNTU_CODENAME"],
                  "io.github.shkwon98.ubuntu.version": os.environ["UBUNTU_VERSION"],
              }
              assert all(labels[key] == value for key, value in expected_labels.items())
          PY
