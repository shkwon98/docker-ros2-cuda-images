name: Build and publish one ROS image

on:
  workflow_call:
    inputs:
      image:
        description: One image configuration from scripts/matrix.py
        type: string
        required: true
      created:
        type: string
        required: true
      publish:
        type: boolean
        required: true
    secrets:
      dockerhub-token:
        required: false

permissions:
  contents: read

jobs:
  build:
    uses: docker/github-builder/.github/workflows/build.yml@v1
    permissions:
      contents: read
      packages: write
      id-token: write
    with:
      job-name-prefix: ${{ fromJSON(inputs.image).tag }}
      output: image
      platforms: linux/amd64,linux/arm64
      push: ${{ inputs.publish }}
      sign: "false"
      cache: true
      cache-mode: max
      cache-scope: ${{ fromJSON(inputs.image).os_tag }}
      meta-images: |
        ghcr.io/${{ github.repository_owner }}/ros2-cuda
        docker.io/${{ github.repository_owner }}/ros2-cuda
      meta-tags: type=raw,value=ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ fromJSON(inputs.image).tag }}
      build-args: |
        BASE_IMAGE_AMD64=${{ fromJSON(inputs.image).platforms['linux/amd64'].base_image }}
        BASE_IMAGE_ARM64=${{ fromJSON(inputs.image).platforms['linux/arm64'].base_image }}
        CUDA_AMD64=${{ fromJSON(inputs.image).platforms['linux/amd64'].cuda_version }}
        CUDA_ARM64=${{ fromJSON(inputs.image).platforms['linux/arm64'].cuda_version }}
        BUILD_DATE=${{ inputs.created }}
        EXPECTED_UBUNTU_VERSION=${{ fromJSON(inputs.image).ubuntu_version }}
        ROS_APT_SOURCE_PACKAGE=${{ fromJSON(inputs.image).ros_apt_source_package }}
        ROS_APT_SOURCE_SHA256=${{ fromJSON(inputs.image).ros_apt_source_sha256 }}
        ROS_APT_SOURCE_VERSION=${{ fromJSON(inputs.image).ros_apt_source_version }}
        ROS_DISTRO=${{ fromJSON(inputs.image).ros_distro }}
        ROS_VARIANT=${{ fromJSON(inputs.image).ros_variant }}
        UBUNTU_CODENAME=${{ fromJSON(inputs.image).ubuntu_codename }}
        VCS_REF=${{ github.sha }}
    secrets:
      registry-auths: |
        - registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        - registry: docker.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.dockerhub-token }}

  publish:
    needs: build
    if: inputs.publish
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-docker-action@v5
        with:
          daemon-config: |
            {"features": {"containerd-snapshotter": true}}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v4
        env:
          DOCKER_LOGIN_SCOPE_DISABLED: true
        with:
          registry-auth: |
            - registry: ghcr.io
              username: ${{ github.actor }}
              password: ${{ secrets.GITHUB_TOKEN }}
            - registry: docker.io
              username: ${{ github.repository_owner }}
              password: ${{ secrets.dockerhub-token }}
      - name: Verify ROS and promote the tested image
        env:
          IMAGE_CONFIG: ${{ inputs.image }}
          DIGEST: ${{ needs.build.outputs.digest }}
        run: >-
          python3 -m scripts.verify_image publish
          --config "$IMAGE_CONFIG" --digest "$DIGEST"
          --owner "$GITHUB_REPOSITORY_OWNER" --revision "$GITHUB_SHA"
