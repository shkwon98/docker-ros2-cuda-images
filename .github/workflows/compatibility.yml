name: Weekly compatibility check

on:
  schedule:
    - cron: "29 4 * * 1"
  workflow_dispatch:

concurrency:
  group: images-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Check upstream dependencies and published images
        run: python3 -m scripts.verify_image compatibility images.json --owner "$GITHUB_REPOSITORY_OWNER"
